AWSTemplateFormatVersion: '2010-09-09'
Description: 'EventPro - Complete Serverless Infrastructure (DynamoDB, Cognito, S3, Lambda, API Gateway)'

Parameters:
  Environment:
    Type: String
    Default: 'production'
    AllowedValues:
      - 'production'
      - 'staging'
      - 'development'
    Description: Deployment environment name

  MediaBucketName:
    Type: String
    Default: 'eventpro-images'
    Description: Base name for the S3 media bucket (AWS Account ID will be automatically appended)

  RazorpayKeyId:
    Type: String
    Default: 'rzp_live_TqawwTSUz6rvuH'
    Description: Live or Test Razorpay Key ID

  RazorpayKeySecret:
    Type: String
    NoEcho: true
    Default: 'UaISwuAoNfWtfvc3v4YKdGck'
    Description: Razorpay Key Secret

  SenderEmail:
    Type: String
    Default: 'no-reply@eventpro24.online'
    Description: Verified AWS SES email for ticket confirmation dispatches

  SupportEmail:
    Type: String
    Default: 'support@eventpro24.online'
    Description: Customer support contact email

Resources:

  # =========================================================================
  # 1. DYNAMODB TABLES
  # =========================================================================

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: EventProUsers
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH

  EventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: EventProEvents
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: eventId
          AttributeType: S
      KeySchema:
        - AttributeName: eventId
          KeyType: HASH

  TicketsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: EventProTickets
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: ticketId
          AttributeType: S
      KeySchema:
        - AttributeName: ticketId
          KeyType: HASH

  PaymentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: EventProPayments
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: paymentId
          AttributeType: S
      KeySchema:
        - AttributeName: paymentId
          KeyType: HASH

  CheckinsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: EventProCheckins
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: checkinId
          AttributeType: S
      KeySchema:
        - AttributeName: checkinId
          KeyType: HASH

  ReviewsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: EventProReviews
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: reviewId
          AttributeType: S
      KeySchema:
        - AttributeName: reviewId
          KeyType: HASH

  AlertsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: EventProAlerts
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: alertId
          AttributeType: S
      KeySchema:
        - AttributeName: alertId
          KeyType: HASH

  # =========================================================================
  # 2. S3 MEDIA BUCKET WITH CORS
  # =========================================================================

  MediaBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${MediaBucketName}-${AWS::AccountId}'
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - '*'
            AllowedMethods:
              - GET
              - PUT
              - POST
              - DELETE
              - HEAD
            AllowedOrigins:
              - '*'
            ExposedHeaders:
              - ETag

  # =========================================================================
  # 3. AMAZON COGNITO (USER POOL, APP CLIENT, IDENTITY POOL)
  # =========================================================================

  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: EventProUserPool
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          RequireUppercase: true

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: EventProWebClient
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  CognitoIdentityPool:
    Type: AWS::Cognito::IdentityPool
    Properties:
      IdentityPoolName: EventProIdentityPool
      AllowUnauthenticatedIdentities: true
      CognitoIdentityProviders:
        - ClientId: !Ref CognitoUserPoolClient
          ProviderName: !GetAtt CognitoUserPool.ProviderName

  CognitoAuthRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: Cognito_EventProAuth_Role_CF
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: cognito-identity.amazonaws.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                cognito-identity.amazonaws.com:aud: !Ref CognitoIdentityPool
              ForAnyValue:StringLike:
                cognito-identity.amazonaws.com:amr: authenticated
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess
        - arn:aws:iam::aws:policy/AmazonS3FullAccess

  CognitoUnauthRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: Cognito_EventProUnauth_Role_CF
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: cognito-identity.amazonaws.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                cognito-identity.amazonaws.com:aud: !Ref CognitoIdentityPool
              ForAnyValue:StringLike:
                cognito-identity.amazonaws.com:amr: unauthenticated
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess
        - arn:aws:iam::aws:policy/AmazonS3ReadOnlyAccess

  IdentityPoolRoleMapping:
    Type: AWS::Cognito::IdentityPoolRoleAttachment
    Properties:
      IdentityPoolId: !Ref CognitoIdentityPool
      Roles:
        authenticated: !GetAtt CognitoAuthRole.Arn
        unauthenticated: !GetAtt CognitoUnauthRole.Arn

  # =========================================================================
  # 4. LAMBDA EXECUTION ROLE & FUNCTION
  # =========================================================================

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: EventProLambdaRole_CF
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess
        - arn:aws:iam::aws:policy/AmazonSESFullAccess

  LambdaPaymentHandler:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: EventPaymentHandler_CF
      Runtime: nodejs20.x
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          RAZORPAY_KEY_ID: !Ref RazorpayKeyId
          RAZORPAY_KEY_SECRET: !Ref RazorpayKeySecret
          SENDER_EMAIL: !Ref SenderEmail
          SUPPORT_EMAIL: !Ref SupportEmail
      Code:
        ZipFile: |
          // Inline bootstrap stub. For full code, upload aws-lambda-backend zip.
          exports.handler = async (event) => {
              return {
                  statusCode: 200,
                  headers: {
                      "Content-Type": "application/json",
                      "Access-Control-Allow-Origin": "*"
                  },
                  body: JSON.stringify({ message: "EventPro API Live via CloudFormation" })
              };
          };

  # =========================================================================
  # 5. API GATEWAY (REST API WITH GREEDY PROXY)
  # =========================================================================

  ApiGatewayRestApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: EventProAPI_CF
      Description: EventPro Serverless REST API
      EndpointConfiguration:
        Types:
          - REGIONAL

  ApiGatewayProxyResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ApiGatewayRestApi
      ParentId: !GetAtt ApiGatewayRestApi.RootResourceId
      PathPart: '{proxy+}'

  ApiGatewayRootMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGatewayRestApi
      ResourceId: !GetAtt ApiGatewayRestApi.RootResourceId
      HttpMethod: ANY
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaPaymentHandler.Arn}/invocations'

  ApiGatewayProxyMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGatewayRestApi
      ResourceId: !Ref ApiGatewayProxyResource
      HttpMethod: ANY
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaPaymentHandler.Arn}/invocations'

  ApiGatewayLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt LambdaPaymentHandler.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiGatewayRestApi}/*/*'

  ApiGatewayDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - ApiGatewayRootMethod
      - ApiGatewayProxyMethod
    Properties:
      RestApiId: !Ref ApiGatewayRestApi
      StageName: prod

# =========================================================================
# 6. OUTPUT VALUES (DIRECTLY USABLE IN aws-config.js)
# =========================================================================

Outputs:
  Region:
    Description: AWS Deployment Region
    Value: !Ref 'AWS::Region'

  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref CognitoUserPool

  AppClientId:
    Description: Cognito Web Client ID
    Value: !Ref CognitoUserPoolClient

  IdentityPoolId:
    Description: Cognito Federated Identity Pool ID (Guest Access Active)
    Value: !Ref CognitoIdentityPool

  S3MediaBucket:
    Description: S3 Media Bucket Name
    Value: !Ref MediaBucket

  ApiGatewayUrl:
    Description: API Gateway Production Endpoint
    Value: !Sub 'https://${ApiGatewayRestApi}.execute-api.${AWS::Region}.amazonaws.com/prod'
