<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventPro | Settings</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Organizer_Dashboard.css">
    <!-- AWS SDK & Auth Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.12/dist/amazon-cognito-identity.min.js"></script>
    <script src="https://sdk.amazonaws.com/js/aws-sdk-2.1408.0.min.js"></script>
    <script src="../aws-config.js"></script>
    <script src="../dashboard-auth.js"></script>
    <script src="organizer-backend.js"></script>
</head>
<body class="organizer-dashboard" data-required-role="organizer">
    <div class="page-shell">
        
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div>
                <div class="brand-wrap">
                    <div class="brand-mark">O</div>
                    <div>
                        <p class="brand-mini">Organizer</p>
                        <h2>EVENTPRO</h2>
                    </div>
                </div>

                <nav class="side-nav">
                    <a href="Event_list_organizer.html">
                        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                        Dashboard
                    </a>
                    <a href="Report_Analytics.html">
                        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
                        Analytics
                    </a>
                    <a href="Ticket_scanning.html">
                        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line></svg>
                        Scanning
                    </a>
                    <a href="Account_settings_organizer.html" class="active">
                        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                        Settings
                    </a>
                </nav>
            </div>
            
            <button class="create-btn-sidebar" onclick="window.location.href='Event_update.html'">
                + Create New Event
            </button>
        </aside>

        <!-- Main Workspace -->
        <main class="main-panel">
            <header class="topbar">
                <div>
                    <p class="eyebrow">Organizer Overview</p>
                    <h1>Account Settings</h1>
                </div>
                <div class="topbar-actions">
                    <div class="user-pill" style="cursor:pointer">
                        <span class="user-avatar">?</span>
                        <span>Loading...</span>
                    </div>
                </div>
            </header>

            <section class="settings-layout">
                <nav class="settings-nav">
                    <a href="#" class="active">Profile</a>
                    <a href="#">Security</a>
                    <a href="#">Notifications</a>
                    <a href="#">Billing</a>
                </nav>

                <div class="form-section">
                    <h3>Personal Information</h3>
                    <form id="profileForm">
                        <div class="form-row">
                            <div class="form-group">
                                <label>First Name</label>
                                <input type="text" id="firstName" class="form-control" placeholder="First Name" required>
                            </div>
                            <div class="form-group">
                                <label>Last Name</label>
                                <input type="text" id="lastName" class="form-control" placeholder="Last Name" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Email Address</label>
                            <input type="email" id="email" class="form-control" placeholder="Email Address" required>
                        </div>
                        
                        <div class="form-actions" style="justify-content: flex-start;">
                            <button type="submit" id="saveProfileBtn" class="btn-primary">Save Changes</button>
                        </div>
                    </form>

                    <div class="danger-zone">
                        <h3>Account Actions</h3>
                        <p style="color: var(--muted); margin-bottom: 24px;">Logout of your current session on this device.</p>
                        <button id="logoutBtn" class="btn-secondary" style="border-color: #ef4444; color: #ef4444;">
                            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="vertical-align: middle; margin-right: 8px;"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                            Logout
                        </button>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script>
        document.getElementById('logoutBtn').addEventListener('click', function() {
            const config = window.EVENTPRO_AWS_CONFIG;
            const sdk = window.AmazonCognitoIdentity;
            
            if (config && sdk && config.userPoolId && config.clientId) {
                const pool = new sdk.CognitoUserPool({
                    UserPoolId: config.userPoolId,
                    ClientId: config.clientId
                });
                const user = pool.getCurrentUser();
                
                if (user) {
                    user.signOut();
                }
            }
            // Redirect to SIGNIN page
            window.location.replace("../SIGNIN.html");
        });

        document.addEventListener('DOMContentLoaded', function() {
            function loadProfile() {
                if (window.OrganizerBackend) {
                    window.OrganizerBackend.getUserProfile(function(err, data) {
                        if (!err && data) {
                            document.getElementById('firstName').value = data.firstName || '';
                            document.getElementById('lastName').value = data.lastName || '';
                            document.getElementById('email').value = data.email || '';
                        }
                    });
                } else {
                    setTimeout(loadProfile, 500);
                }
            }
            setTimeout(loadProfile, 1000);

            document.getElementById('profileForm').addEventListener('submit', function(e) {
                e.preventDefault();
                const btn = document.getElementById('saveProfileBtn');
                btn.textContent = 'Saving...';
                btn.disabled = true;

                const userData = {
                    firstName: document.getElementById('firstName').value,
                    lastName: document.getElementById('lastName').value,
                    email: document.getElementById('email').value
                };

                window.OrganizerBackend.updateUserProfile(userData, function(err, data) {
                    btn.disabled = false;
                    btn.textContent = 'Save Changes';
                    if (err) {
                        alert('Error saving profile: ' + err.message);
                    } else {
                        alert('Profile updated successfully!');
                        // Also update UI elements
                        const initial = userData.firstName ? userData.firstName.charAt(0).toUpperCase() : '?';
                        document.querySelectorAll('.user-avatar').forEach(el => el.textContent = initial);
                        document.querySelectorAll('.user-pill span:not(.user-avatar)').forEach(el => el.textContent = userData.firstName);
                    }
                });
            });
        });
    </script>
</body>
</html>
