<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventPro | Scanner</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Organizer_Dashboard.css">
    <!-- AWS SDK & Auth Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.12/dist/amazon-cognito-identity.min.js"></script>
    <script src="https://sdk.amazonaws.com/js/aws-sdk-2.1408.0.min.js"></script>
    <script src="../aws-config.js"></script>
    <script src="../dashboard-auth.js"></script>
    <script src="organizer-backend.js"></script>
</head>
<body class="organizer-dashboard" data-required-role="organizer">
    <div class="page-shell">
        
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div>
                <div class="brand-wrap">
                    <div class="brand-mark">O</div>
                    <div>
                        <p class="brand-mini">Organizer</p>
                        <h2>EVENTPRO</h2>
                    </div>
                </div>

                <nav class="side-nav">
                    <a href="Event_list_organizer.html">
                        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                        Dashboard
                    </a>
                    <a href="Report_Analytics.html">
                        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
                        Analytics
                    </a>
                    <a href="Ticket_scanning.html" class="active">
                        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line></svg>
                        Scanning
                    </a>
                    <a href="Account_settings_organizer.html">
                        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                        Settings
                    </a>
                </nav>
            </div>
        </aside>

        <!-- Main Workspace -->
        <main class="main-panel">
            <header class="topbar">
                <div>
                    <p class="eyebrow">On-site Management</p>
                    <h1>Ticket Scanning</h1>
                </div>
                <div class="topbar-actions">
                    <div class="user-pill" onclick="window.location.href='Account_settings_organizer.html'" style="cursor:pointer">
                        <span class="user-avatar">?</span>
                        <span>Loading...</span>
                    </div>
                </div>
            </header>

            <section class="scanner-container">
                <div style="text-align: center; margin-bottom: 24px;">
                    <h3 style="margin: 0 0 8px;">Scan QR Code</h3>
                    <p style="color: var(--muted); margin: 0;">Position the QR code within the frame to scan.</p>
                </div>
                
                <div class="camera-viewfinder">
                    <div class="scan-line"></div>
                    <span style="color: rgba(255,255,255,0.3); font-weight: 600; font-size: 1.2rem; z-index: 10;">Camera Feed</span>
                </div>

                <div style="width: 100%; border-top: 1px solid var(--border); margin: 24px 0;"></div>

                <div style="width: 100%;">
                    <h4 style="margin: 0 0 12px; color: var(--muted);">Manual Entry</h4>
                    <div class="manual-entry">
                        <input type="text" id="ticketCode" class="form-control" placeholder="Enter ticket code (e.g. TKT-1234)">
                        <button type="button" id="verifyTicketBtn" class="btn-primary">Verify</button>
                    </div>
                    <div id="scanResult" style="margin-top: 16px; font-weight: 600; text-align: center;"></div>
                </div>
            </section>
        </main>
    </div>

    <script>
        document.getElementById('verifyTicketBtn').addEventListener('click', function() {
            const code = document.getElementById('ticketCode').value.trim();
            const resultDiv = document.getElementById('scanResult');
            const btn = document.getElementById('verifyTicketBtn');

            if (!code) {
                resultDiv.textContent = 'Please enter a ticket code.';
                resultDiv.style.color = '#ef4444';
                return;
            }

            if (!window.OrganizerBackend) {
                resultDiv.textContent = 'Backend not initialized.';
                resultDiv.style.color = '#ef4444';
                return;
            }

            btn.textContent = 'Checking...';
            btn.disabled = true;
            resultDiv.textContent = '';

            window.OrganizerBackend.verifyTicket(code, function(err, ticket) {
                btn.textContent = 'Verify';
                btn.disabled = false;
                
                if (err) {
                    resultDiv.textContent = '❌ Invalid or not found: ' + err.message;
                    resultDiv.style.color = '#ef4444';
                } else if (ticket.status === 'Used') {
                    resultDiv.textContent = '⚠️ Ticket valid but already used!';
                    resultDiv.style.color = '#f59e0b';
                } else {
                    resultDiv.textContent = '✅ Ticket Valid! Admit one.';
                    resultDiv.style.color = '#10b981';
                    // Optional: You could update the ticket status to 'Used' here in a real scenario
                }
            });
        });
    </script>
</body>
</html>
