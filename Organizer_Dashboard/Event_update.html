<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventPro | Update Event</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Organizer_Dashboard.css">
    <!-- AWS SDK & Auth Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.12/dist/amazon-cognito-identity.min.js"></script>
    <script src="https://sdk.amazonaws.com/js/aws-sdk-2.1408.0.min.js"></script>
    <script src="../aws-config.js"></script>
    <script src="../dashboard-auth.js"></script>
    <script src="organizer-backend.js"></script>
</head>
<body class="organizer-dashboard" data-required-role="organizer">
    <div class="page-shell">
        
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div>
                <div class="brand-wrap">
                    <div class="brand-mark">O</div>
                    <div>
                        <p class="brand-mini">Organizer</p>
                        <h2>EVENTPRO</h2>
                    </div>
                </div>

                <nav class="side-nav">
                    <a href="Event_list_organizer.html">
                        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                        Dashboard
                    </a>
                    <a href="Report_Analytics.html">
                        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
                        Analytics
                    </a>
                    <a href="Ticket_scanning.html">
                        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line></svg>
                        Scanning
                    </a>
                    <a href="Account_settings_organizer.html">
                        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                        Settings
                    </a>
                </nav>
            </div>
            
            <button class="create-btn-sidebar" onclick="window.location.href='Event_list_organizer.html'">
                Back to Dashboard
            </button>
        </aside>

        <!-- Main Workspace -->
        <main class="main-panel">
            <header class="topbar">
                <div>
                    <p class="eyebrow">Event Management</p>
                    <h1>Create or Update Event</h1>
                </div>
                <div class="topbar-actions">
                    <div class="user-pill" onclick="window.location.href='Account_settings_organizer.html'" style="cursor:pointer">
                        <span class="user-avatar">?</span>
                        <span>Loading...</span>
                    </div>
                </div>
            </header>

            <section class="form-section">
                <form id="eventForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Event Name</label>
                            <input type="text" id="eventName" class="form-control" placeholder="E.g., Winters Camp 2026" required>
                        </div>
                        <div class="form-group">
                            <label>Event Category</label>
                            <select id="eventCategory" class="form-control" required>
                                <option value="" disabled selected>Select Category</option>
                                <option value="movies">Movies</option>
                                <option value="stream">Stream</option>
                                <option value="concert">Live Events</option>
                                <option value="plays">Plays & Theatre</option>
                                <option value="sports">Sports</option>
                                <option value="comedy">Standup Comedy</option>
                                <option value="camping">Camping</option>
                                <option value="workshop">Workshops</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label>Date</label>
                            <input type="date" id="eventDate" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>Time</label>
                            <div style="display: flex; gap: 8px;">
                                <input type="text" id="eventTime" class="form-control" placeholder="12:00" pattern="^(0?[1-9]|1[0-2]):[0-5][0-9]$" title="Format: HH:MM (12-hour)" required>
                                <select id="eventAmPm" class="form-control" style="width: auto; flex-shrink: 0;">
                                    <option value="AM">AM</option>
                                    <option value="PM">PM</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Location / Venue</label>
                            <input type="text" id="eventLocation" class="form-control" placeholder="Full address or virtual link" required>
                        </div>
                        <div class="form-group">
                            <label>Google Maps Link (Optional)</label>
                            <input type="url" id="googleMapLink" class="form-control" placeholder="https://maps.google.com/...">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Ticket Sales Deadline Date</label>
                            <input type="date" id="salesDeadlineDate" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>Ticket Sales Deadline Time</label>
                            <div style="display: flex; gap: 8px;">
                                <input type="text" id="salesDeadlineTime" class="form-control" placeholder="11:59" pattern="^(0?[1-9]|1[0-2]):[0-5][0-9]$" title="Format: HH:MM (12-hour)" required>
                                <select id="salesDeadlineAmPm" class="form-control" style="width: auto; flex-shrink: 0;">
                                    <option value="AM">AM</option>
                                    <option value="PM" selected>PM</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Total Capacity</label>
                            <input type="number" id="eventCapacity" class="form-control" placeholder="E.g., 500" required>
                        </div>
                        <div class="form-group">
                            <label>Ticket Price (₹)</label>
                            <input type="number" step="0.01" id="eventPrice" class="form-control" placeholder="0.00 for free" required>
                        </div>
                    </div>

                    <!-- Proof-of-Presence Smart Deposit (Zero No-Show Guarantee) -->
                    <div style="background: rgba(16, 185, 129, 0.08); border: 1px solid rgba(16, 185, 129, 0.25); border-radius: 12px; padding: 16px; margin: 16px 0;">
                        <label style="display: flex; align-items: flex-start; gap: 10px; cursor: pointer; color: var(--text);">
                            <input type="checkbox" id="hasDepositBond" style="accent-color: #10b981; width: 18px; height: 18px; margin-top: 2px;">
                            <div style="flex: 1;">
                                <strong style="color: #6ee7b7; display: flex; align-items: center; gap: 8px; font-size: 0.95rem;">
                                    <span>🛡️ Proof-of-Presence Smart Refund Engine</span>
                                    <span style="background: rgba(16, 185, 129, 0.2); color: #10b981; font-size: 0.72rem; padding: 2px 8px; border-radius: 10px; font-weight: 700;">Zero No-Show Guarantee</span>
                                </strong>
                                <span style="font-size: 0.82rem; color: var(--muted); display: block; margin-top: 4px; line-height: 1.4;">
                                    Eliminate empty seats for free or subsidized events. Attendees pay a refundable deposit that is <strong>automatically refunded to their account the instant their ticket is scanned at the venue gate</strong>. No-show deposits are forfeited to the organizer.
                                </span>
                            </div>
                        </label>
                        <div id="depositAmountRow" style="display: none; margin-top: 12px; padding-top: 12px; border-top: 1px dashed rgba(16, 185, 129, 0.25);">
                            <label style="font-size: 0.82rem; color: #a7f3d0; font-weight: 600; display: block; margin-bottom: 6px;">Refundable Pledge Deposit Amount (₹ per ticket)</label>
                            <input type="number" id="depositAmount" class="form-control" placeholder="50.00" min="5" step="5" style="max-width: 220px; background: var(--bg-dark); border: 1px solid rgba(16, 185, 129, 0.4); color: #fff;">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Event Description</label>
                        <textarea id="eventDescription" class="form-control" placeholder="Describe your event..." required></textarea>
                    </div>

                    <div class="form-group">
                        <label>Event Cover Image</label>
                        <div class="image-upload-zone" onclick="document.getElementById('eventImage').click()" style="cursor: pointer;">
                            <svg width="32" height="32" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                            <p id="imageNameDisplay">Click to browse or upload an image</p>
                            <input type="file" id="eventImage" accept="image/*" style="display: none;">
                        </div>
                    </div>

                    <!-- Automatic Schedule / Venue Change Broadcast Option -->
                    <div id="broadcastAlertContainer" style="display: none; background: rgba(59, 130, 246, 0.1); border: 1px solid rgba(59, 130, 246, 0.3); border-radius: 12px; padding: 16px; margin: 20px 0;">
                        <label style="display: flex; align-items: flex-start; gap: 10px; cursor: pointer; color: var(--text);">
                            <input type="checkbox" id="broadcastUpdateAlert" checked style="accent-color: var(--primary); width: 18px; height: 18px; margin-top: 2px;">
                            <div>
                                <strong style="color: #93c5fd; display: block; font-size: 0.95rem;">📢 Auto-Broadcast Schedule / Venue Change Alert</strong>
                                <span style="font-size: 0.85rem; color: var(--muted);">Automatically notify all registered attendees via in-app alert & email about updates to date, time, or venue.</span>
                            </div>
                        </label>
                    </div>

                    <div class="form-actions">
                        <button type="button" class="btn-secondary" onclick="window.location.href='Event_list_organizer.html'">Cancel</button>
                        <button type="submit" class="btn-primary" id="saveEventBtn">Save Event</button>
                    </div>
                </form>
            </section>
        </main>
    </div>

    <script>
        let existingEventData = null;
        const urlParams = new URLSearchParams(window.location.search);
        const eventId = urlParams.get('id');

        document.addEventListener('DOMContentLoaded', () => {
            if (eventId) {
                document.querySelector('h1').textContent = "Update Event";
                document.getElementById('saveEventBtn').textContent = "Update Event";
                document.getElementById('broadcastAlertContainer').style.display = "block";
                loadExistingEvent();
            }
        });

        function loadExistingEvent() {
            if (window.OrganizerBackend) {
                window.OrganizerBackend.getEvent(eventId, (err, event) => {
                    if (err) {
                        alert("Error loading event details: " + err.message);
                        return;
                    }
                    existingEventData = event;
                    
                    document.getElementById('eventName').value = event.eventName || "";
                    if (event.category) {
                        document.getElementById('eventCategory').value = event.category;
                    }
                    document.getElementById('eventDate').value = event.date || "";
                    if (event.time) {
                        const parts = event.time.split(' ');
                        document.getElementById('eventTime').value = parts[0] || "";
                        if (parts.length > 1) {
                            document.getElementById('eventAmPm').value = parts[1];
                        }
                    }
                    document.getElementById('eventLocation').value = event.location || "";
                    document.getElementById('googleMapLink').value = event.googleMapLink || "";
                    
                    // Sales Deadline parsing (separate date & time)
                    if (event.salesDeadlineDate) {
                        document.getElementById('salesDeadlineDate').value = event.salesDeadlineDate;
                    } else if (event.salesDeadline && event.salesDeadline.includes('T')) {
                        document.getElementById('salesDeadlineDate').value = event.salesDeadline.split('T')[0];
                    } else if (event.salesDeadline && event.salesDeadline.includes(' ')) {
                        document.getElementById('salesDeadlineDate').value = event.salesDeadline.split(' ')[0];
                    } else if (event.salesDeadline) {
                        document.getElementById('salesDeadlineDate').value = event.salesDeadline;
                    }

                    if (event.salesDeadlineTime) {
                        const dlParts = event.salesDeadlineTime.split(' ');
                        document.getElementById('salesDeadlineTime').value = dlParts[0] || "";
                        if (dlParts.length > 1) {
                            document.getElementById('salesDeadlineAmPm').value = dlParts[1];
                        }
                    } else if (event.salesDeadline && event.salesDeadline.includes('T')) {
                        const tPart = event.salesDeadline.split('T')[1];
                        if (tPart) {
                            document.getElementById('salesDeadlineTime').value = tPart.substring(0, 5);
                        }
                    } else if (event.salesDeadline && event.salesDeadline.includes(' ')) {
                        const sParts = event.salesDeadline.split(' ');
                        if (sParts.length > 1) {
                            document.getElementById('salesDeadlineTime').value = sParts[1];
                        }
                        if (sParts.length > 2) {
                            document.getElementById('salesDeadlineAmPm').value = sParts[2];
                        }
                    }

                    const hasBond = event.hasDepositBond === true || event.hasDepositBond === 'true' || (parseFloat(event.refundableDeposit) > 0);
                    if (hasBond) {
                        document.getElementById('hasDepositBond').checked = true;
                        document.getElementById('depositAmountRow').style.display = 'block';
                        document.getElementById('depositAmount').value = event.refundableDeposit || 50;
                    }
                    document.getElementById('eventDescription').value = event.description || "";
                    if (event.imageUrl) {
                        document.getElementById('imageNameDisplay').textContent = "Image already uploaded (Click to change)";
                    }
                });
            } else {
                setTimeout(loadExistingEvent, 500);
            }
        }

        // Toggle deposit amount input row
        const hasDepositBondEl = document.getElementById('hasDepositBond');
        if (hasDepositBondEl) {
            hasDepositBondEl.addEventListener('change', function() {
                const row = document.getElementById('depositAmountRow');
                if (row) {
                    row.style.display = this.checked ? 'block' : 'none';
                    if (this.checked && !document.getElementById('depositAmount').value) {
                        document.getElementById('depositAmount').value = "50";
                    }
                }
            });
        }

        document.getElementById('eventImage').addEventListener('change', function(e) {
            if (this.files && this.files[0]) {
                document.getElementById('imageNameDisplay').textContent = this.files[0].name;
            }
        });

        document.getElementById('eventForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('saveEventBtn');
            btn.textContent = eventId ? "Updating..." : "Saving...";
            btn.disabled = true;

            const fileInput = document.getElementById('eventImage');
            let uploadedImageUrl = existingEventData ? existingEventData.imageUrl : "";

            if (!window.OrganizerBackend) {
                alert("Backend not loaded.");
                btn.disabled = false;
                btn.textContent = eventId ? "Update Event" : "Save Event";
                return;
            }

            try {
                if (fileInput.files && fileInput.files.length > 0) {
                    btn.textContent = "Uploading Image...";
                    uploadedImageUrl = await new Promise((resolve, reject) => {
                        window.OrganizerBackend.uploadImage(fileInput.files[0], (err, url) => {
                            if (err) reject(err);
                            else resolve(url);
                        });
                    });
                }
            } catch (err) {
                alert("Image upload failed: " + err.message);
                btn.disabled = false;
                btn.textContent = eventId ? "Update Event" : "Save Event";
                return;
            }

            btn.textContent = eventId ? "Updating Event..." : "Saving Event...";
            const newDate = document.getElementById('eventDate').value;
            const newTime = document.getElementById('eventTime').value + ' ' + document.getElementById('eventAmPm').value;
            const newLocation = document.getElementById('eventLocation').value;
            const newEventName = document.getElementById('eventName').value;
            const newCategory = document.getElementById('eventCategory').value;

            const dlDate = document.getElementById('salesDeadlineDate').value;
            const dlTime = document.getElementById('salesDeadlineTime').value + ' ' + document.getElementById('salesDeadlineAmPm').value;
            const combinedSalesDeadline = dlDate ? `${dlDate} ${dlTime}` : '';

            // Check if schedule or venue changed
            const isScheduleChanged = existingEventData && (
                existingEventData.date !== newDate ||
                existingEventData.time !== newTime ||
                existingEventData.location !== newLocation
            );

            const hasDepositChecked = document.getElementById('hasDepositBond').checked;
            const depositVal = hasDepositChecked ? (parseFloat(document.getElementById('depositAmount').value) || 50) : 0;

            const eventData = {
                eventId: eventId,
                eventName: newEventName,
                category: newCategory,
                date: newDate,
                time: newTime,
                location: newLocation,
                googleMapLink: document.getElementById('googleMapLink').value,
                salesDeadline: combinedSalesDeadline,
                salesDeadlineDate: dlDate,
                salesDeadlineTime: dlTime,
                capacity: parseInt(document.getElementById('eventCapacity').value),
                price: parseFloat(document.getElementById('eventPrice').value),
                hasDepositBond: hasDepositChecked,
                refundableDeposit: depositVal,
                description: document.getElementById('eventDescription').value,
                imageUrl: uploadedImageUrl,
                status: existingEventData ? existingEventData.status : "Active",
                ticketsSold: existingEventData ? existingEventData.ticketsSold : 0,
                revenue: existingEventData ? existingEventData.revenue : 0,
                createdAt: existingEventData ? existingEventData.createdAt : new Date().toISOString()
            };

            window.OrganizerBackend.saveEvent(eventData, function(err, savedItem) {
                btn.disabled = false;
                btn.textContent = eventId ? "Update Event" : "Save Event";
                if (err) {
                    alert("Error saving event: " + err.message);
                    return;
                }

                // If schedule changed and organizer opted into broadcast alert
                const shouldBroadcast = document.getElementById('broadcastUpdateAlert') && document.getElementById('broadcastUpdateAlert').checked;
                if (eventId && isScheduleChanged && shouldBroadcast) {
                    const changeDetails = [];
                    if (existingEventData.date !== newDate) changeDetails.push(`New Date: ${newDate}`);
                    if (existingEventData.time !== newTime) changeDetails.push(`New Time: ${newTime}`);
                    if (existingEventData.location !== newLocation) changeDetails.push(`New Venue: ${newLocation}`);

                    window.OrganizerBackend.broadcastEventAlert({
                        eventId: eventId,
                        eventName: newEventName,
                        title: `Schedule Update: ${newEventName}`,
                        message: `The organizer updated the event details. ${changeDetails.join(" | ")}. Please check your updated booking pass.`,
                        priority: "high",
                        sendEmail: true
                    }, function(alertErr, alertRes) {
                        alert(`Event updated and alert broadcast to ${alertRes?.recipientCount || 0} registered attendee(s)!`);
                        window.location.href = "Event_list_organizer.html";
                    });
                } else {
                    alert(eventId ? "Event updated successfully!" : "Event saved successfully!");
                    window.location.href = "Event_list_organizer.html";
                }
            });
        });
    </script>
</body>
</html>
