<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventPro | Organizer Dashboard</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- CSS -->
    <link rel="stylesheet" href="Organizer_Dashboard.css">
    <!-- AWS SDK & Auth Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.12/dist/amazon-cognito-identity.min.js"></script>
    <script src="https://sdk.amazonaws.com/js/aws-sdk-2.1408.0.min.js"></script>
    <script src="../aws-config.js"></script>
    <script src="../dashboard-auth.js"></script>
    <script src="organizer-backend.js"></script>
</head>
<body class="organizer-dashboard" data-required-role="organizer">
    <div class="page-shell">
        
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div>
                <div class="brand-wrap">
                    <div class="brand-mark">O</div>
                    <div>
                        <p class="brand-mini">Organizer</p>
                        <h2>EVENTPRO</h2>
                    </div>
                </div>

                <nav class="side-nav">
                    <a href="Event_list_organizer.html" class="active">
                        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                        Dashboard
                    </a>
                    <a href="Report_Analytics.html">
                        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
                        Analytics
                    </a>
                    <a href="Ticket_scanning.html">
                        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line></svg>
                        Scanning
                    </a>
                    <a href="Account_settings_organizer.html">
                        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                        Settings
                    </a>
                </nav>
            </div>
            
            <button class="create-btn-sidebar" onclick="window.location.href='Event_update.html'">
                + Create New Event
            </button>
        </aside>

        <!-- Main Workspace -->
        <main class="main-panel">
            <header class="topbar">
                <div>
                    <p class="eyebrow">Organizer Overview</p>
                    <h1>Your Events</h1>
                </div>
                <div class="topbar-actions">
                    <!-- The user pill is updated by dashboard-auth.js -->
                    <div class="user-pill" onclick="window.location.href='Account_settings_organizer.html'" style="cursor:pointer">
                        <span class="user-avatar">?</span>
                        <span>Loading...</span>
                    </div>
                </div>
            </header>

            <!-- Analytics Summary Grid -->
            <section class="analytics-grid">
                <div class="stat-card revenue">
                    <span>Total Revenue</span>
                    <strong>$14,250</strong>
                    <div class="stat-trend trend-up">↑ 12% this month</div>
                </div>
                <div class="stat-card tickets">
                    <span>Tickets Sold</span>
                    <strong>458</strong>
                    <div class="stat-trend trend-up">↑ 48 this week</div>
                </div>
                <div class="stat-card views">
                    <span>Event Page Views</span>
                    <strong>3,102</strong>
                    <div class="stat-trend trend-flat">→ Stable</div>
                </div>
            </section>

            <!-- Manage Events Table -->
            <section class="events-section">
                <div class="section-head">
                    <h3>Manage Events</h3>
                </div>

                <table class="event-table">
                    <thead>
                        <tr>
                            <th>Event Details</th>
                            <th>Date</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="eventListBody">
                        <tr>
                            <td colspan="4" style="text-align: center; color: var(--muted);">Loading events...</td>
                        </tr>
                    </tbody>
                </table>
            </section>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            function loadEvents() {
                if (window.OrganizerBackend) {
                    window.OrganizerBackend.getEvents(function(err, events) {
                        const tbody = document.getElementById('eventListBody');
                        if (err) {
                            tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: #ef4444;">Error loading events: ' + err.message + '</td></tr>';
                            return;
                        }

                        if (!events || events.length === 0) {
                            tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: var(--muted);">No events found. Create one to get started!</td></tr>';
                            return;
                        }

                        tbody.innerHTML = '';
                        events.forEach(function(event) {
                            const initial = event.eventName ? event.eventName.substring(0, 2).toUpperCase() : 'EV';
                            const dateObj = new Date(event.date);
                            const formattedDate = dateObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
                            const isDraft = event.status === 'Draft';
                            const statusClass = isDraft ? 'status-draft' : 'status-active';
                            
                            const tr = document.createElement('tr');
                            tr.className = 'event-row';
                            tr.innerHTML = `
                                <td class="event-title-cell">
                                    <div class="event-thumb">${initial}</div>
                                    <div class="event-info">
                                        <h4>${event.eventName || 'Unnamed Event'}</h4>
                                        <p>${event.ticketsSold || 0}/${event.capacity || 0} Tickets Sold</p>
                                    </div>
                                </td>
                                <td>
                                    <strong>${formattedDate}</strong><br>
                                    <small style="color: var(--muted)">${event.time || ''}</small>
                                </td>
                                <td><span class="status-badge ${statusClass}">${event.status || 'Active'}</span></td>
                                <td>
                                    <button class="action-btn" onclick="window.location.href='Event_update.html?id=${event.eventId}'">Edit</button>
                                </td>
                            `;
                            tbody.appendChild(tr);
                        });
                    });
                } else {
                    setTimeout(loadEvents, 500); // Retry if backend not yet loaded
                }
            }
            
            // Allow time for dashboard-auth.js to setup AWS credentials before loading
            setTimeout(loadEvents, 1000); 
        });
    </script>
</body>
</html>
