<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventPro | Saved Events</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css" integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2" crossorigin="anonymous">
    <link rel="stylesheet" href="Saved_Events.css">
    <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.12/dist/amazon-cognito-identity.min.js"></script>
    <script src="../aws-config.js"></script>
    <script src="../dashboard-auth.js"></script>
</head>
<body class="saved-page" data-required-role="attendee">
    <div class="page-shell">
        <aside class="sidebar">
            <div class="brand-wrap">
                <div class="brand-mark">E</div>
                <div>
                    <p class="brand-mini">Attendee</p>
                    <h2>EVENTPRO</h2>
                </div>
            </div>
            <nav class="side-nav">
                <a href="Event_List.html">Explore Events</a>
                <a href="Your_Booking.html">My Bookings</a>
                <a href="Account_settings.html">Account Settings</a>
                <a href="Saved_Events.html" class="active">Saved Events</a>
            </nav>
        </aside>

        <main class="main-panel">
            <header class="topbar">
                <div>
                    <p class="eyebrow">Favorites</p>
                    <h1>Saved events</h1>
                </div>
                <div class="topbar-actions">
                    <button class="ghost-btn">Explore more</button>
                </div>
            </header>

            <section class="saved-grid">
                <article class="saved-card">
                    <div class="event-banner banner-one">Design</div>
                    <h3>Creative Design Summit</h3>
                    <p>15 Nov 2026 · New York</p>
                    <button class="primary-btn">Book now</button>
                </article>
                <article class="saved-card">
                    <div class="event-banner banner-two">AI</div>
                    <h3>Future of AI</h3>
                    <p>18 Nov 2026 · Austin</p>
                    <button class="primary-btn">Book now</button>
                </article>
                <article class="saved-card">
                    <div class="event-banner banner-three">Food</div>
                    <h3>Street Food Festival</h3>
                    <p>28 Nov 2026 · Chicago</p>
                    <button class="primary-btn">Book now</button>
                </article>
            </section>
        </main>
    </div>
</body>
</html>
