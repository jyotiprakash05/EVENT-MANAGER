<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventPro | Saved Events</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- CSS -->
    <link rel="stylesheet" href="Attendee_Dashboard.css">
    <!-- EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        (function() {
            emailjs.init("YOUR_PUBLIC_KEY");
        })();
    </script>
    <!-- AWS SDK & Auth Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.12/dist/amazon-cognito-identity.min.js"></script>
    <script src="https://sdk.amazonaws.com/js/aws-sdk-2.1408.0.min.js"></script>
    <script src="../aws-config.js"></script>
    <script src="../dashboard-auth.js"></script>
    <script src="attendee-backend.js"></script>
</head>
<body class="attendee-dashboard" data-required-role="attendee">
    <div class="page-shell">
        
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div>
                <div class="brand-wrap">
                    <div class="brand-mark">E</div>
                    <div>
                        <p class="brand-mini">Attendee</p>
                        <h2>EVENTPRO</h2>
                    </div>
                </div>

                <nav class="side-nav">
                    <a href="Event_List.html">
                        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                        Explore Events
                    </a>
                    <a href="Your_Booking.html">
                        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                        My Bookings
                    </a>
                    <a href="Saved_Events.html" class="active">
                        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
                        Saved Events
                    </a>
                    <a href="Account_settings.html">
                        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                        Settings
                    </a>
                </nav>
            </div>
            
            <div class="sidebar-card">
                <p>Curated for you</p>
                <h3 id="sidebarSavedCount">0 saved events</h3>
                <span>Book them before tickets sell out!</span>
            </div>
        </aside>

        <!-- Main Workspace -->
        <main class="main-panel">
            <header class="topbar">
                <div>
                    <p class="eyebrow">Attendee Overview</p>
                    <h1>Saved Events</h1>
                </div>
                <div class="topbar-actions">
                    <div class="user-pill" onclick="window.location.href='Account_settings.html'" style="cursor:pointer">
                        <span class="user-avatar">?</span>
                        <span>Loading...</span>
                    </div>
                </div>
            </header>

            <section class="event-panel">
                <div class="section-head">
                    <h3>Your Shortlist</h3>
                    <div class="panel-tools">
                        <input id="eventSearch" type="search" placeholder="Search saved events..." aria-label="Search events">
                    </div>
                </div>

                <div class="event-grid" id="eventGrid">
                    <p style="color: var(--muted); padding: 20px;">Loading saved events...</p>
                </div>
            </section>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            let activeEvents = [];
            let userProfile = {};

            function loadData() {
                if (window.AttendeeBackend) {
                    window.AttendeeBackend.getUserProfile((err, profile) => {
                        if (err) return;
                        userProfile = profile;
                        const savedEventIds = profile.savedEvents || [];
                        
                        document.getElementById('sidebarSavedCount').textContent = savedEventIds.length + ' saved events';

                        window.AttendeeBackend.getAllEvents(function(err, events) {
                            const grid = document.getElementById('eventGrid');
                            if (err) {
                                grid.innerHTML = '<p style="color: #ef4444; padding: 20px;">Error loading events: ' + err.message + '</p>';
                                return;
                            }

                            // Filter to only show events that are saved
                            const savedEventsList = events.filter(e => savedEventIds.includes(e.eventId));
                            activeEvents = savedEventsList;

                            if (savedEventsList.length === 0) {
                                grid.innerHTML = '<p style="color: var(--muted); padding: 20px;">You haven\'t saved any events yet. Explore events and click "Save"!</p>';
                                return;
                            }

                            renderEvents(savedEventsList);
                        });
                    });
                } else {
                    setTimeout(loadData, 500);
                }
            }

            function renderEvents(events) {
                const grid = document.getElementById('eventGrid');
                grid.innerHTML = '';

                events.forEach(function(event, index) {
                    const initial = event.eventName ? event.eventName.substring(0, 2).toUpperCase() : 'EV';
                    const dateObj = new Date(event.date);
                    const formattedDate = dateObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
                    const priceDisplay = event.price > 0 ? '$' + parseFloat(event.price).toFixed(2) : 'Free';
                    
                    let locationDisplay = event.location || 'TBA';
                    if (event.googleMapLink) {
                        locationDisplay = `<a href="${event.googleMapLink}" target="_blank" style="color: var(--primary); text-decoration: none; display: inline-flex; align-items: center; gap: 4px;">
                        <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                        ${locationDisplay}</a>`;
                    }

                    let bookBtnHTML = `<button class="primary-btn book-btn" data-id="${event.eventId}">Book now</button>`;
                    if (event.salesDeadline) {
                        const deadlineDate = new Date(event.salesDeadline);
                        if (new Date() > deadlineDate) {
                            bookBtnHTML = `<button class="primary-btn" disabled style="background:var(--border); color:var(--muted); cursor:not-allowed;">Sales Closed</button>`;
                        }
                    }
                    
                    const gradients = ['gradient-one', 'gradient-two', 'gradient-three', 'gradient-four'];
                    const gradientClass = gradients[index % gradients.length];
                    
                    const article = document.createElement('article');
                    article.className = 'event-card';
                    
                    article.innerHTML = `
                        <div class="event-image ${gradientClass}">${initial}</div>
                        <div class="event-body">
                            <div class="event-row">
                                <span class="tag">Saved</span>
                                <span class="rating">★ 4.9</span>
                            </div>
                            <h4>${event.eventName || 'Unnamed Event'}</h4>
                            <p class="meta-line">${formattedDate} • ${event.time || 'TBD'} • ${locationDisplay}</p>
                            <div class="event-footer">
                                <div class="price-box">
                                    <small>Price</small>
                                    <strong>${priceDisplay}</strong>
                                </div>
                                <div class="action-row">
                                    <button class="save-btn saved" data-id="${event.eventId}">Remove</button>
                                    ${bookBtnHTML}
                                </div>
                            </div>
                        </div>
                    `;
                    grid.appendChild(article);
                });

                attachListeners();
            }

            function attachListeners() {
                // Remove (Unsave) buttons
                document.querySelectorAll('.save-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const eventId = this.getAttribute('data-id');
                        const self = this;
                        window.AttendeeBackend.toggleSavedEvent(eventId, (err, data) => {
                            if (!err) {
                                // Reload to remove it from UI entirely
                                loadData();
                            }
                        });
                    });
                });

                // Book buttons
                document.querySelectorAll('.book-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const eventId = this.getAttribute('data-id');
                        const event = activeEvents.find(e => e.eventId === eventId);
                        const self = this;

                        self.disabled = true;
                        self.textContent = 'Booking...';

                        window.AttendeeBackend.bookTicket(event, (err, ticket) => {
                            if (err) {
                                alert("Failed to book ticket: " + err.message);
                                self.disabled = false;
                                self.textContent = 'Book now';
                            } else {
                                alert("Success! QR code has been emailed via EmailJS. Ticket is in My Bookings.");
                                self.textContent = 'Booked';
                            }
                        });
                    });
                });
            }

            const searchInput = document.getElementById('eventSearch');
            searchInput.addEventListener('input', function () {
                const query = this.value.trim().toLowerCase();
                const cards = document.querySelectorAll('.event-card');
                cards.forEach(card => {
                    const text = card.textContent.toLowerCase();
                    card.style.display = text.includes(query) ? 'flex' : 'none';
                });
            });

            setTimeout(loadData, 1000); 
        });
    </script>
</body>
</html>
