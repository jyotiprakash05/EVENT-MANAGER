<!doctype html>
<html>
	<head>
		<title>EventPro - Sign Up</title>
		<link rel="stylesheet" href="SIGNUP.css">
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css">
		<script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.12/dist/amazon-cognito-identity.min.js"></script>
		<script src="https://sdk.amazonaws.com/js/aws-sdk-2.1408.0.min.js"></script>
		<script src="aws-config.js"></script>
		<script src="auth.js"></script>
	</head>
	<body class="sign-up-page">
		<main class="sign-up-card">
			<h1>Create your account</h1>
			<p class="sign-up-subtitle">Join EventPro and start planning better events</p>
			<form class="sign-up-form">
				<fieldset class="role-selection">
					<legend>Register as</legend>
					<div class="role-options">
						<label class="role-option">
							<input type="radio" name="user-type" value="attendee" required>
							<span>Attendee</span>
						</label>
						<label class="role-option">
							<input type="radio" name="user-type" value="organizer">
							<span>Organizer</span>
						</label>
					</div>
				</fieldset>
				<div class="name-fields">
					<div class="form-group">
						<label for="first-name">First name</label>
						<input type="text" class="form-control" id="first-name" name="first-name" placeholder="First name" required>
					</div>
					<div class="form-group">
						<label for="last-name">Last name</label>
						<input type="text" class="form-control" id="last-name" name="last-name" placeholder="Last name" required>
					</div>
				</div>
				<div class="form-group">
					<label for="email">Email address</label>
					<input type="email" class="form-control" id="email" name="email" placeholder="you@example.com" required>
				</div>
				<div class="form-group">
					<label for="phone">Phone number</label>
					<input type="tel" class="form-control" id="phone" name="phone" placeholder="+1 (555) 123-4567" required>
				</div>
				<div class="form-group">
					<label for="password">Password</label>
					<input type="password" class="form-control" id="password" name="password" placeholder="Create a password" required>
				</div>
				<button type="submit" class="btn sign-up-button">Sign Up</button>
			</form>
			<form class="verify-form" style="display: none;">
				<p>We've sent a verification code to your email.</p>
				<div class="form-group">
					<label for="verification-code">Verification Code</label>
					<input type="text" class="form-control" id="verification-code" name="code" placeholder="Enter OTP code" required>
				</div>
				<button type="submit" class="btn sign-up-button">Verify & Continue</button>
			</form>
			<p class="sign-in-prompt">Already have an account? <a href="SIGNIN.html">Sign In</a></p>
		</main>
	</body>
</html>
