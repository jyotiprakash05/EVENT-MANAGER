<!Doctype html>
<html>
    <head>
        <title>EventPro - Sign In</title>
        <link rel="stylesheet" href="SIGNIN.CSS">
         <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css" integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2" crossorigin="anonymous">
         <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
         <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
         <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.min.js" integrity="sha384-w1Q4orYjBQndcko6MimVbzY0tgp4pWB4lZ7lr30WKz0vr/aWKhXdBNmNb5D92v7s" crossorigin="anonymous"></script>
         <script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.12/dist/amazon-cognito-identity.min.js"></script>
         <script src="https://sdk.amazonaws.com/js/aws-sdk-2.1408.0.min.js"></script>
         <script src="aws-config.js"></script>
         <script src="auth.js"></script>
    </head>
    <body class="sign-in-page">
        <main class="sign-in-card">
            <h1>Welcome back</h1>
            <p class="sign-in-subtitle">Sign in to your EventPro account</p>
            <form class="sign-in-form">
                <fieldset class="role-selection">
                    <legend>Sign in as</legend>
                    <div class="role-options">
                        <label class="role-option">
                            <input type="radio" name="user-type" value="attendee" required>
                            <span>Attendee</span>
                        </label>
                        <label class="role-option">
                            <input type="radio" name="user-type" value="organizer">
                            <span>Organizer</span>
                        </label>
                    </div>
                </fieldset>
                <div class="form-group">
                    <label for="email">Email address</label>
                    <input type="email" class="form-control" id="email" name="email" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn sign-in-button">Sign In</button>
            </form>
            <p class="sign-up-prompt">Don't have an account? <a href="signup.html">Sign Up</a></p>
        </main>
    </body>
</html>
